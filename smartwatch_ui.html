<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VITALSYNC — Smartwatch Companion</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-watch: #000000;
      --case-titanium: #1c1e22;
      --case-border: #2e3238;
      --text-main: #f8fafc;
      --text-muted: #8e95a5;
      --text-dim: #555b6a;
      
      --accent: #3b82f6;
      --success: #10b981;
      --warning: #f59e0b;
      --danger: #ef4444;

      --font-sans: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: #090a0f;
      color: var(--text-main);
      font-family: var(--font-sans);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
      -webkit-font-smoothing: antialiased;
    }

    .meta-bar {
      margin-bottom: 20px;
      font-size: 12px;
      color: var(--text-muted);
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .meta-bar a {
      color: var(--accent);
      text-decoration: none;
    }

    .watch-chassis {
      position: relative;
      width: 280px;
      height: 392px; /* 2.5 : 3.5 aspect ratio */
      background-color: var(--case-titanium);
      border-radius: 42px;
      padding: 10px;
      border: 1px solid var(--case-border);
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6);
    }

    .digital-crown {
      position: absolute;
      right: -8px;
      top: 76px;
      width: 7px;
      height: 48px;
      background-color: #272a30;
      border: 1px solid #3a3f48;
      border-radius: 3px;
      cursor: pointer;
    }

    .side-button {
      position: absolute;
      right: -6px;
      top: 144px;
      width: 5px;
      height: 60px;
      background-color: #24262c;
      border-radius: 3px;
      cursor: pointer;
    }

    .watch-screen {
      width: 100%;
      height: 100%;
      background-color: var(--bg-watch);
      border-radius: 38px;
      overflow: hidden;
      padding: 16px 14px 12px;
      display: flex;
      flex-direction: column;
      position: relative;
    }

    .status-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 12px;
      font-weight: 600;
      color: var(--text-muted);
      margin-bottom: 12px;
    }

    .conn-status {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 11px;
    }

    .dot {
      width: 6px;
      height: 6px;
      border-radius: 9999px;
      background-color: var(--success);
    }

    .dot.offline {
      background-color: var(--danger);
    }

    .screen-content {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .metric-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }

    .metric-card {
      background-color: #111318;
      border: 1px solid rgba(255, 255, 255, 0.06);
      border-radius: 12px;
      padding: 10px;
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .metric-label {
      font-size: 11px;
      color: var(--text-muted);
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .metric-value-row {
      display: flex;
      align-items: baseline;
      gap: 4px;
      margin-top: 2px;
    }

    .metric-num {
      font-size: 24px;
      font-weight: 700;
      font-variant-numeric: tabular-nums;
      color: var(--text-main);
    }

    .metric-unit {
      font-size: 11px;
      color: var(--text-muted);
    }

    .status-card {
      background-color: #111318;
      border: 1px solid rgba(255, 255, 255, 0.06);
      border-radius: 12px;
      padding: 10px 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 8px;
    }

    .status-left {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .status-title {
      font-size: 11px;
      color: var(--text-muted);
    }

    .status-label {
      font-size: 14px;
      font-weight: 600;
      color: var(--success);
    }

    .status-label.warning { color: var(--warning); }
    .status-label.danger { color: var(--danger); }

    .alert-banner {
      position: absolute;
      inset: 0;
      background-color: #000000;
      padding: 20px 16px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      border-radius: 38px;
      z-index: 20;
    }

    .alert-banner.hidden { display: none; }

    .alert-header {
      display: flex;
      align-items: center;
      gap: 8px;
      color: var(--danger);
      font-size: 13px;
      font-weight: 700;
    }

    .alert-body {
      font-size: 13px;
      color: var(--text-main);
      line-height: 1.4;
    }

    .btn-ack {
      background-color: var(--danger);
      color: #ffffff;
      border: none;
      border-radius: 9999px;
      padding: 10px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      width: 100%;
    }

    @keyframes critical-pulse {
      0% { box-shadow: inset 0 0 0 1px var(--danger); }
      50% { box-shadow: inset 0 0 0 2px var(--danger), 0 0 12px rgba(239, 68, 68, 0.4); }
      100% { box-shadow: inset 0 0 0 1px var(--danger); }
    }

    .watch-screen.critical-pulse {
      animation: critical-pulse 1.8s ease-in-out infinite;
    }
  </style>
</head>
<body>

  <div class="meta-bar">
    <span>Standalone Watch Companion</span>
    <span>·</span>
    <span>Authoritative surface in <a href="http://localhost:5174">user-ui/</a></span>
  </div>

  <div class="watch-chassis">
    <div class="digital-crown" id="crown" title="Digital Crown"></div>
    <div class="side-button" id="side-button" title="Side Button"></div>

    <div class="watch-screen" id="watch-screen">
      
      <div class="status-bar">
        <span id="watch-time">09:41</span>
        <div class="conn-status">
          <span class="dot" id="conn-dot"></span>
          <span id="conn-text">Live</span>
        </div>
      </div>

      <div class="screen-content">
        <div class="metric-grid">
          <div class="metric-card">
            <span class="metric-label">
              <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4.05 3 5.5l7 7Z"/></svg>
              Heart rate
            </span>
            <div class="metric-value-row">
              <span class="metric-num" id="val-hr">—</span>
              <span class="metric-unit">BPM</span>
            </div>
          </div>

          <div class="metric-card">
            <span class="metric-label">
              <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2.69l5.66 5.66a8 8 0 1 1-11.31 0z"/></svg>
              SpO2
            </span>
            <div class="metric-value-row">
              <span class="metric-num" id="val-spo2">—</span>
              <span class="metric-unit">%</span>
            </div>
          </div>

          <div class="metric-card">
            <span class="metric-label">
              <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 4v10.54a4 4 0 1 1-4 0V4a2 2 0 0 1 4 0Z"/></svg>
              Body temp
            </span>
            <div class="metric-value-row">
              <span class="metric-num" id="val-temp">—</span>
              <span class="metric-unit">°C</span>
            </div>
          </div>

          <div class="metric-card">
            <span class="metric-label">
              <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/></svg>
              Activity
            </span>
            <div class="metric-value-row">
              <span class="metric-num" id="val-act" style="font-size: 16px; font-weight: 600;">Rest</span>
            </div>
          </div>
        </div>

        <div class="status-card">
          <div class="status-left">
            <span class="status-title">Status</span>
            <span class="status-label" id="val-status">Normal</span>
          </div>
          <span class="metric-unit" id="val-env">Nominal</span>
        </div>
      </div>

      <div class="alert-banner hidden" id="alert-banner">
        <div class="alert-header">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3Z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>
          <span id="alert-title">Critical alert</span>
        </div>
        <div class="alert-body" id="alert-body">
          Elevated risk detected.
        </div>
        <button class="btn-ack" id="btn-ack">Acknowledge</button>
      </div>

    </div>
  </div>

  <script>
    function updateClock() {
      const el = document.getElementById("watch-time");
      if (el) {
        const d = new Date();
        el.innerText = `${String(d.getHours()).padStart(2, "0")}:${String(d.getMinutes()).padStart(2, "0")}`;
      }
    }
    updateClock();
    setInterval(updateClock, 1000);

    let ws = null;
    let currentAlertId = null;

    function connect() {
      const protocol = window.location.protocol === "https:" ? "wss:" : "ws:";
      const host = window.location.hostname || "localhost";
      const port = window.location.port || "8000";
      const wsUrl = `${protocol}//${host}:${port}/ws/live`;

      const dot = document.getElementById("conn-dot");
      const txt = document.getElementById("conn-text");

      ws = new WebSocket(wsUrl);

      ws.onopen = () => {
        if (dot) dot.classList.remove("offline");
        if (txt) txt.innerText = "Live";
      };

      ws.onmessage = (e) => {
        try {
          const data = JSON.parse(e.data);
          handlePayload(data);
        } catch (err) {}
      };

      ws.onclose = () => {
        if (dot) dot.classList.add("offline");
        if (txt) txt.innerText = "Offline";
        setTimeout(connect, 2500);
      };

      ws.onerror = () => {
        if (dot) dot.classList.add("offline");
        if (txt) txt.innerText = "Offline";
      };
    }

    function handlePayload(payload) {
      if (payload.event_type !== "TELEMETRY_UPDATE") return;

      const raw = payload.raw_sensors || {};
      const feat = payload.features || {};
      const esc = payload.escalation || {};
      const ml = payload.ml_predictions || {};
      const overall = ml.overall_health_risk || {};

      if (raw.heart_rate) document.getElementById("val-hr").innerText = Math.round(raw.heart_rate);
      if (raw.spo2) document.getElementById("val-spo2").innerText = Math.round(raw.spo2);
      if (raw.body_temperature) document.getElementById("val-temp").innerText = raw.body_temperature.toFixed(1);

      const actLabels = ["Rest", "Light", "Moderate", "Vigorous", "Fall"];
      const actVal = feat.activity_level !== undefined ? actLabels[feat.activity_level] || "Rest" : "Rest";
      document.getElementById("val-act").innerText = actVal;

      const level = esc.escalated_level || overall.risk_level || "LOW";
      const statusEl = document.getElementById("val-status");
      const screenEl = document.getElementById("watch-screen");

      if (level === "CRITICAL") {
        statusEl.innerText = "Critical";
        statusEl.className = "status-label danger";
        screenEl.classList.add("critical-pulse");
      } else if (level === "EARLY_WARNING" || level === "ELEVATED") {
        statusEl.innerText = "Warning";
        statusEl.className = "status-label warning";
        screenEl.classList.remove("critical-pulse");
      } else {
        statusEl.innerText = "Normal";
        statusEl.className = "status-label";
        screenEl.classList.remove("critical-pulse");
      }

      const alertBanner = document.getElementById("alert-banner");
      if (payload.active_alert && !payload.active_alert.acknowledged) {
        currentAlertId = payload.active_alert.alert_id;
        document.getElementById("alert-title").innerText = payload.active_alert.risk_type || "Critical alert";
        document.getElementById("alert-body").innerText = payload.active_alert.message || "Immediate attention recommended.";
        alertBanner.classList.remove("hidden");
      } else {
        alertBanner.classList.add("hidden");
        currentAlertId = null;
      }
    }

    document.getElementById("btn-ack").addEventListener("click", async () => {
      if (currentAlertId) {
        try {
          await fetch(`/api/alerts/${currentAlertId}/acknowledge`, { method: "POST" });
        } catch (e) {}
      }
      document.getElementById("alert-banner").classList.add("hidden");
    });

    connect();
  </script>
</body>
</html>
